name: XSS Test
on: [push]
jobs:
  xss:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p test-results
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="XSS">
              <testcase name="<img src=x onerror=alert(1)>" time="1"/>
            </testsuite>
          </testsuites>' > test-results/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: junit
          path: test-results/junit.xml
          
